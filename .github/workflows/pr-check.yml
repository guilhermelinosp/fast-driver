name: pr-check

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@latest

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@latest

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@latest
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit

  flutter-quality:
    uses: guilhermelinosp/templates/.github/workflows/flutter-quality.yml@ci/flutter-quality
    with:
      flutter-version: 3.47.x
      coverage-threshold: 85
    secrets: inherit

  pr-gate:
    if: always()
    needs: [merge-check, gitleaks, labeler, flutter-quality]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        shell: python
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          failed = [k for k, v in needs.items() if v.get('result') not in ('success', 'skipped')]
          if failed:
              print('BLOCKED-BY:', failed)
              sys.exit(1)
          print('ALL-GREEN')
