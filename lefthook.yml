# https://github.com/evilmartians/lefthook
# Install: brew install lefthook && lefthook install

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.dart"
      run: dart format --output=none --set-exit-if-changed {staged_files}
    analyze:
      run: flutter analyze --fatal-infos
    yamllint:
      glob: "*.{yaml,yml}"
      run: test -z "{staged_files}" || yamllint {staged_files}
    secrets-scan:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks detect --source . --no-git -v
        else
          echo "gitleaks not installed; skipping"
        fi

pre-push:
  parallel: false
  commands:
    lockfile:
      run: flutter pub get --enforce-lockfile
    test:
      run: flutter test

commit-msg:
  commands:
    conventional:
      run: >-
        grep -Eq "^(feat|fix|docs|style|refactor|perf|test|ci|chore|revert|ops)(\(.+\))?!?: .+" {1}
